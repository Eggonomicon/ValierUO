# CraftedSellBoost.cfg (COMPATIBLE with GenericSell_ConfigBoost_ConfigOnly.cs)
# ==========================================================
# This config works with the "config multipliers only" GenericSell version.
#
# Supported keys (used by the new GenericSell.cs):
#   CraftedSellBoost.Enabled=true|false
#   CraftedSellBoost.Cap=<int>                         (0 disables cap)
#   CraftedSellBoost.Weapon.Mult=<double>
#   CraftedSellBoost.Weapon.ExceptionalMult=<double>
#   CraftedSellBoost.Ranged.Mult=<double>              (bows/crossbows/mechanical xbows)
#   CraftedSellBoost.Ranged.ExceptionalMult=<double>
#   CraftedSellBoost.Armor.Mult=<double>
#   CraftedSellBoost.Armor.ExceptionalMult=<double>
#   CraftedSellBoost.Clothing.Mult=<double>
#   CraftedSellBoost.Clothing.ExceptionalMult=<double>
#   CraftedSellBoost.Jewelry.Mult=<double>
#   CraftedSellBoost.Jewelry.ExceptionalMult=<double>
#
# Notes:
# - Keys like IgnoreAmmo / PerItemCap / LowQualityPenalty are kept below for reference,
#   but the new GenericSell.cs ignores them (it already doesn't boost ammo, and uses ServUO's normal quality logic).
# - If you previously tuned bow prices via Weapon.Mult, you MUST set Ranged.Mult here,
#   because the new GenericSell.cs uses separate ranged multipliers for BaseRanged.
# ==========================================================

CraftedSellBoost.Enabled=true

# Optional cap on final crafted sell price (0 disables cap)
CraftedSellBoost.Cap=200000

# --- Legacy/ignored by the new script (safe to keep, but unused) ---
CraftedSellBoost.IgnoreAmmo=true
CraftedSellBoost.PerItemCap=200000
CraftedSellBoost.LowQualityPenalty=0.60

# Multipliers for crafted items (melee weapons)
CraftedSellBoost.Weapon.Mult=4.0
CraftedSellBoost.Weapon.ExceptionalMult=12.0

# Multipliers for crafted RANGED weapons (bows/crossbows/mechanical xbows)
# Set these to match Weapon.* to preserve your previous behavior.
CraftedSellBoost.Ranged.Mult=4.0
CraftedSellBoost.Ranged.ExceptionalMult=12.0

# Armor
CraftedSellBoost.Armor.Mult=3.5
CraftedSellBoost.Armor.ExceptionalMult=10.0

# Clothing (cloaks/robes/etc.)
CraftedSellBoost.Clothing.Mult=3.0
CraftedSellBoost.Clothing.ExceptionalMult=6.0

# Jewelry
CraftedSellBoost.Jewelry.Mult=3.0
CraftedSellBoost.Jewelry.ExceptionalMult=6.0
