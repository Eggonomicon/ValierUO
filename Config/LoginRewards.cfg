LoginRewards.Enabled=true
LoginRewards.OncePerAccountPerDay=false
LoginRewards.Mode=Calendar7
LoginRewards.ClaimMode=Gump
# Add/ensure these in Config/LoginRewards.cfg for character-based claims
# (This script ALSO defaults to Character if not set)
LoginRewards.IdentityMode=Character
# Legacy (optional): LoginRewards.OncePerAccountPerDay=false

# Example: add PowerHour token/scroll to daily rewards
# (Use the class name defined in your PowerHour script; typical is PowerHourToken)
# LoginRewards.Rewards=Gold:5000|PowerHourToken:1 

# Base daily rewards (calendar rotation)
LoginRewards.Calendar7=1=Gold:2500|Bandage:30|PowerHourToken:1|ValierCoinVoucher:5;2=Gold:5000|RecallScroll:2|PowerHourToken:1|ValierCoinVoucher:5;3=Gold:5500|GreaterHealPotion:3|PowerHourToken:1|ValierCoinVoucher:5;4=Gold:6000|Bandage:50|PowerHourToken:1|ValierCoinVoucher:5;5=Gold:6500|TotalRefreshPotion:2|PowerHourToken:1|ValierCoinVoucher:5;6=Gold:7000|LuckyLoginCache:1|PowerHourToken:1|ValierCoinVoucher:5;7=Gold:1000|LuckyLoginCache:2|PowerHourToken:1|ValierCoinVoucher:5

# Every 3 streak days, show a choice list
LoginRewards.ChoiceEveryDays=3
LoginRewards.ChoiceReplacesBase=false

# The repeating choice list for every-3rd day
LoginRewards.Choices.Every3=Potion Bundle=GreaterHealPotion:6|GreaterCurePotion:6|TotalRefreshPotion:4;Travel Bundle=RecallScroll:10|GateTravelScroll:2;Lucky Cache=LuckyLoginCache:2|Gold:2000