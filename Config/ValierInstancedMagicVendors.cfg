# ValierInstancedMagicVendors.cfg - Phase 8
# Phase 8 replaces the Phase 7 script/config.
# Commodity vendors from Phase 1 still remain separate.

RefreshHours=24
RefreshOnWorldLoad=true
DeleteUnsoldStockOnRefresh=true

# Region/town markups remain OFF by default
EnableRegionMarkups=false

# Featured item behavior
FeaturedCount=2
FeaturedPreferHighTier=true

# Optional per-account high-tier controls
EnableHighTierBuyLimits=false
HighTierThreshold=3
HighTierLimitPerAccountPerCycle=1

EnableHighTierCooldowns=false
HighTierCooldownHours=24

# Purchase logging
EnablePurchaseLogging=true

# Region markups (only used if EnableRegionMarkups=true)
Region.Britain=1.05
Region.Minoc=1.10
Region.Yew=1.08
Region.Moonglow=1.12

# Region preferred modes for Mixed/Signature stock
RegionPreferredMode.Britain=Weapons
RegionPreferredMode.Minoc=Armor
RegionPreferredMode.Yew=Treasure
RegionPreferredMode.Moonglow=Jewelry

# Profile.<Name>.Mode=Weapons|Armor|Mixed|Jewelry|Treasure|Signature

