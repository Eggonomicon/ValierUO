# ValierAccountBank.cfg
# ValierUO Account Bank (shared per account)

Enabled=true

RequireNearBanker=true
BankerRange=3

RequireUnlockScroll=false
UnlockedByDefault=true

# Visuals for the account bank container item
BoxItemID=0xE7C
BoxHue=0x489
BoxName=Account Bank Box

# Which layer to equip the hidden container on before opening (BankBox-style)
# Must be a layer not used by normal player gear.
IntroLayer=ShopResale

# Note: Account bank box is temporarily Visible while open to allow drag/drop (required by CanSee checks).

# Auto-close behavior (OSI feel)
AutoCloseWhenOutOfRange=true
AutoCloseCheckSeconds=0.5
