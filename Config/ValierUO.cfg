# ValierUO.cfg
# Simple config for ValierUO (ServUO pub57 fork)
# Key = Value, # comments supported

# Branding
BrandName=ValierUO

# Performance / Saves
# SaveStrategy can be: auto | standard | dual | parallel | dynamic
SaveStrategy=auto

# Default for World.Save() when called without the permitBackgroundWrite parameter.
# true  = allow save strategies to flush to disk in the background (when supported)
# false = block until all save writes are complete (safer, more pause)
PermitBackgroundWriteDefault=false

# Diagnostics
EnablePerfCommands=true
