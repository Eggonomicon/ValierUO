# ValierBoosters.cfg
# ==========================================================
# Valier Boosters (Loot, Fame, Skill Gain)
# Reads: Config/ValierBoosters.cfg (direct)
# Saves: Saves/ValierBoosters.xml
# ==========================================================

ValierBoosters.Enabled=true

# If true, re-using a booster token extends time (up to MaxMinutes) and keeps the best %.
ValierBoosters.AllowExtend=true
ValierBoosters.MaxMinutes=240


# =========================
# LOOT BOOST
# =========================
ValierBoosters.Loot.Enabled=true

# Default bonus % for loot tokens (if no per-token override)
# Applies as "extra gold added to corpse", based on gold already on the corpse.
ValierBoosters.Loot.GoldBonusPercent=50

# Optional: extra loot roll on each creature death while loot boost is active.
# 0.10 = 10% chance to add 1 random item from ExtraItemTypes to corpse.
ValierBoosters.Loot.ExtraItemChance=0.10
ValierBoosters.Loot.ExtraItemTypes=Amber|Amethyst|Citrine|Diamond|Emerald|Ruby|Sapphire|StarSapphire|Tourmaline


# =========================
# FAME BOOST
# =========================
ValierBoosters.Fame.Enabled=true
ValierBoosters.Fame.BonusPercent=50


# =========================
# SKILL GAIN BOOST (reuses your PowerHourSystem)
# =========================
ValierBoosters.SkillGain.Enabled=true

# Default multiplier if no per-token override
ValierBoosters.SkillGain.Multiplier=2.5


# =========================
# Per-token overrides (recommended)
# Token keys:
#   Loot30m, Loot60m, Fame30m, Fame60m, Skill30m, Skill60m
# =========================

# Force both loot tokens to be exactly +50% (even if you later change the default)
ValierBoosters.Token.Loot30m.Percent=50
ValierBoosters.Token.Loot60m.Percent=50

# Optional: force fame tokens to be exactly +50%
ValierBoosters.Token.Fame30m.Percent=50
ValierBoosters.Token.Fame60m.Percent=50

# Optional: tune skill gain multipliers per token
#ValierBoosters.Token.Skill30m.Multiplier=2.0
#ValierBoosters.Token.Skill60m.Multiplier=3.0
